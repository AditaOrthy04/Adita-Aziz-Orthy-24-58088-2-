<!DOCTYPE html>
<html>
<head>
    <title>Seventeen Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Registration Form</h1>

  <form>
  
  <div>
   <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
		</div>
     <br>
	 <br>

<div>
  <label for="email">Email:</label>
  <input type="email" id="email" name="email">
  </div>
        <br>
		<br>

<div>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
		</div>
        <br><br>
 <div>
        <label for="gender">Gender:</label>
        <input type = "radio"  id = "gender" value= "female" > female
		 <input type = "radio" id = "gender" value= "male" > male
		 </div>
        <br><br>
		
		<div>
		<label for = "DOB" > Date of birth : </label>
		 <input type="Date" id="dob" name="dob">
		</div>
		<br>
		<br>
		
		 <div>
        <label for="Age"> Age:</label>
        <input type = "number"  id = "number" value= "number" > 
		 </div>
        <br><br>

<div>
        <label for="department">Department:</label>
        <select id="department" name="department">
            <option value="">Select Department</option>
            <option value="cse">CSE</option>
            <option value="eee">EEE</option>
            <option value="bba">BBA</option>
        </select>
		</div>
        <br><br>
		
		<div>
		<label for="religion">religion:</label>
        <input type = "checkbox"  id = "r1" name="r2"  value= "Islam" checked > Islam
		 <input type = "radio" id = "r2" name="r3" value= "hindu" > hindu
		 </div>
		 <br>
		
 <div>
        <label for="address">Address:</label>
        <textarea  col="4" rows="6"></textarea>
		</div>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
