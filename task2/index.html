<!doctype html>
<html>
<head>
	<title>Library Membership Form</title>
	<link rel = "stylesheet" href="style.css">
</head>
<body>
	<h1>Library Membership Form</h1>
	<form id ="memberForm">
	
		<label>Name:</label>
		<input type = "text" id = "name" required>
		<br><br>
		
		<label>Age:</label>
		<input type = "number" id = "age" required>
		<br><br>
		
		<label>Email:</label>
		<input type = "email" id = "email" required>
		<br><br>
		
		<label>Phone:</label>
		<input type = "text" id = "number" required>
		<br><br>
		
		<label> Type:</label>
		<input type = "radio" name= "type" value = "Basic" required> Basic
		<input type = "radio" name= "type" value = "Silver"> Silver
		<input type = "radio" name= "type" value = "Gold"> Gold
		<br><br>
		<input type ="submit" value ="Register">
		
	</form>	
	<hr>
	<div id= "output" > </div>
	<script src= "script.js"> </script>
		
</body>
</html>
